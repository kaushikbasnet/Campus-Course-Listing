<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCT College Dublin – Programs</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #c8102e;
        --brand-dark: #8c0b20;
        --brand-light: #fceef1;
        --accent: #f9c846;
        --bg: #faf5f6;
        --card-bg: #ffffff;
        --text: #1a0508;
        --muted: #6b4a50;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Figtree", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .hero {
        background: linear-gradient(
          150deg,
          #c8102e 0%,
          #8c0b20 55%,
          #3a0410 100%
        );
        color: white;
        padding: 60px 40px 50px;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 0 260px 260px 0;
        border-color: transparent rgba(249, 200, 70, 0.12) transparent
          transparent;
      }
      .hero-inner {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
      }
      .hero-tag {
        display: inline-block;
        background: var(--accent);
        color: var(--brand-dark);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 5px 14px;
        border-radius: 4px;
        margin-bottom: 18px;
      }
      .hero h1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(36px, 7vw, 70px);
        letter-spacing: 2px;
        line-height: 1;
        margin-bottom: 14px;
      }
      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 22px;
      }
      .hero-meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, 0.8);
      }
      .hero-meta-item i {
        color: var(--accent);
      }
      .hero-meta-item a {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: underline;
      }

      .intake-chips {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 14px 0 0;
      }
      .chip {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 14px;
        border-radius: 20px;
      }

      .wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px 60px;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 50px 0 20px;
      }
      .section-label h2 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 24px;
        letter-spacing: 1px;
        color: var(--brand);
        white-space: nowrap;
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(to right, var(--brand-light), transparent);
      }

      .course-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 18px;
      }

      .course-card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 20px;
        border-top: 5px solid var(--brand);
        box-shadow: 0 2px 12px rgba(200, 16, 46, 0.08);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        display: flex;
        flex-direction: column;
      }
      .course-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(200, 16, 46, 0.15);
      }

      .course-title {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        margin-bottom: 12px;
      }
      .detail {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .detail i {
        color: var(--brand);
        width: 14px;
      }
      .badge {
        display: inline-block;
        background: var(--brand-light);
        color: var(--brand);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 10px;
      }
      .intake-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 4px;
      }
      .dot-open {
        background: #22c55e;
      }
      .dot-closed {
        background: #94a3b8;
      }

      .btn-group {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 14px;
      }
      .btn {
        flex: 1;
        padding: 9px 8px;
        border-radius: 7px;
        text-align: center;
        text-decoration: none;
        font-weight: 700;
        font-size: 12px;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-primary {
        background: var(--brand);
        color: white;
      }
      .btn-secondary {
        background: var(--brand-light);
        color: var(--brand);
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-tag">Dublin City, Ireland</div>
        <h1>CCT College Dublin</h1>
        <div class="intake-chips">
          <span class="chip"
            ><i
              class="fa-solid fa-circle"
              style="color: #22c55e; font-size: 8px"
            ></i>
            February 2026 Intake Open</span
          >
          <span class="chip"
            ><i
              class="fa-solid fa-circle"
              style="color: #22c55e; font-size: 8px"
            ></i>
            September 2026 Intake Open</span
          >
        </div>
        <div class="hero-meta" style="margin-top: 22px">
          <div class="hero-meta-item">
            <i class="fa-solid fa-graduation-cap"></i> Undergraduate &
            Postgraduate
          </div>
          <div class="hero-meta-item">
            <i class="fa-solid fa-globe"></i>
            <a
              href="https://www.cct.ie/course-delivery/full-time/"
              target="_blank"
              >www.cct.ie</a
            >
          </div>
        </div>
      </div>
    </div>

    <div class="wrapper" id="app"></div>

    <script>
      // [name, level, fee, duration, feb, sep]
      const sections = [
        {
          title: "Undergraduate Programs",
          courses: [
            [
              "Bachelor of Arts (Hons) in Business",
              "Undergraduate",
              "€8,600 / €4,500 / €4,500",
              "3 Years",
              "Open",
              "Open",
            ],
            [
              "BSc (Hons) in Computing and IT",
              "Undergraduate",
              "€8,600 / €5,000 / €5,000 / €5,000",
              "4 Years",
              "Not Open",
              "Open",
            ],
          ],
        },
        {
          title: "Postgraduate Programs",
          courses: [
            [
              "MA in International Business",
              "Postgraduate",
              "€12,000",
              "14 Months",
              "Open",
              "Open",
            ],
            [
              "MSc in Applied Software Development",
              "Postgraduate",
              "€14,000",
              "14 Months",
              "Open",
              "Open",
            ],
            [
              "MSc in Cybersecurity",
              "Postgraduate",
              "€14,000",
              "14 Months",
              "Open",
              "Open",
            ],
            [
              "MSc in Computing",
              "Postgraduate",
              "€14,000",
              "14 Months",
              "Open",
              "Open",
            ],
            [
              "MSc in Data Analytics",
              "Postgraduate",
              "€14,000",
              "14 Months",
              "Open",
              "Open",
            ],
          ],
        },
      ];

      const app = document.getElementById("app");
      sections.forEach((sec) => {
        const lbl = document.createElement("div");
        lbl.className = "section-label";
        lbl.innerHTML = `<h2>${sec.title}</h2>`;
        app.appendChild(lbl);

        const grid = document.createElement("div");
        grid.className = "course-grid";

        sec.courses.forEach((c) => {
          const card = document.createElement("div");
          card.className = "course-card";
          const febColor = c[4] === "Open" ? "dot-open" : "dot-closed";
          const sepColor = c[5] === "Open" ? "dot-open" : "dot-closed";
          card.innerHTML = `
      <span class="badge">${c[1]}</span>
      <div class="course-title">${c[0]}</div>
      <div class="detail"><i class="fa-solid fa-euro-sign"></i> ${c[2]}</div>
      <div class="detail"><i class="fa-solid fa-clock"></i> ${c[3]}</div>
      <div class="detail"><i class="fa-solid fa-calendar"></i>
        <span><span class="intake-dot ${febColor}"></span>Feb 2026: ${c[4]}</span>
        &nbsp;&nbsp;
        <span><span class="intake-dot ${sepColor}"></span>Sep 2026: ${c[5]}</span>
      </div>
      <div class="detail"><i class="fa-solid fa-location-dot"></i> Dublin City, Ireland</div>
      <div class="btn-group">
        <a href="https://www.cct.ie/course-delivery/full-time/" target="_blank" class="btn btn-secondary">Learn More</a>
        <a href="https://cmst.xyz/form/7e8a525a-8729-4d95-8938-5ee4355d29ec/general-inquiry-forms" target="_blank" class="btn btn-primary">Apply Now</a>
      </div>
    `;
          grid.appendChild(card);
        });
        app.appendChild(grid);
      });
    </script>
  </body>
</html>
