<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCT College Dublin — Course Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #001d3d;
        --blue: #004f9f;
        --mid: #0066cc;
        --bg: #f2f5f9;
        --surface: #ffffff;
        --surf2: #ebf0f7;
        --border: rgba(0, 79, 159, 0.13);
        --text: #0f172a;
        --muted: #5e7491;
        --light: #94a3b8;
        --radius: 12px;
        --rsm: 8px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      .page-header {
        background: #eef3fa;
        border-bottom: 1px solid rgba(0, 79, 159, 0.15);
        padding: 28px 5% 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      .page-eyebrow {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .page-title {
        font-family: "Syne", sans-serif;
        font-size: clamp(1.4rem, 2.5vw, 1.9rem);
        font-weight: 800;
        color: var(--navy);
        letter-spacing: -0.01em;
        line-height: 1.15;
      }
      .page-title span {
        color: var(--blue);
      }
      .page-sub {
        margin-top: 5px;
        font-size: 0.82rem;
        color: var(--muted);
        font-weight: 300;
      }
      .header-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .header-counts {
        display: flex;
        gap: 24px;
      }
      .hcount {
        text-align: right;
      }
      .hcount-num {
        font-family: "Syne", sans-serif;
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--navy);
        line-height: 1;
      }
      .hcount-lbl {
        font-size: 0.62rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 2px;
      }
      .header-info {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .hinfo-pill {
        font-size: 0.68rem;
        font-weight: 500;
        color: var(--muted);
        background: rgba(0, 79, 159, 0.07);
        border: 1px solid rgba(0, 79, 159, 0.15);
        padding: 4px 12px;
        border-radius: 100px;
        white-space: nowrap;
      }
      .hinfo-pill strong {
        color: var(--navy);
      }
      .main {
        padding: 28px 5% 80px;
      }
      .field-section {
        margin-bottom: 38px;
      }
      .field-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
      }
      .field-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #16a34a;
      }
      .field-name {
        font-family: "Syne", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: var(--navy);
      }
      .field-count {
        font-size: 0.67rem;
        font-weight: 600;
        color: var(--muted);
        background: var(--surf2);
        padding: 3px 9px;
        border-radius: 100px;
      }
      .course-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      .course-card {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 20px 20px 16px;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          border-color 0.2s;
        position: relative;
        overflow: hidden;
      }
      .course-card::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: #16a34a;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .course-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(22, 163, 74, 0.12);
        border-color: rgba(22, 163, 74, 0.35);
      }
      .course-card:hover::after {
        opacity: 1;
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .card-award {
        font-size: 0.62rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 3px 9px;
        border-radius: 100px;
        white-space: nowrap;
      }
      .award-ug {
        background: #eff6ff;
        color: #1d4ed8;
      }
      .award-pg {
        background: #f0fdf4;
        color: #166634;
      }
      .course-name {
        font-family: "Syne", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1.45;
        margin-bottom: 16px;
        flex: 1;
      }
      .card-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 12px;
        margin-bottom: 14px;
      }
      .info-label {
        font-size: 0.58rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--light);
        margin-bottom: 3px;
      }
      .info-value {
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text);
        line-height: 1.35;
      }
      .fee-val {
        color: var(--blue);
        font-weight: 600;
      }
      .info-note {
        font-size: 0.68rem;
        color: var(--muted);
        margin-top: 2px;
        font-style: italic;
      }
      .intake-row {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .intake-badge {
        font-size: 0.65rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 5px;
        border: 1px solid;
      }
      .intake-open {
        background: #f0fdf4;
        color: #166534;
        border-color: #bbf7d0;
      }
      .test-section {
        margin-bottom: 14px;
      }
      .score-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .score-item {
        background: var(--surf2);
        border-radius: 6px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .score-label {
        font-size: 0.55rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--light);
      }
      .score-val {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text);
      }
      .card-divider {
        height: 1px;
        background: var(--border);
        margin-bottom: 12px;
      }
      .card-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
      .learn-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--blue);
        background: transparent;
        border: 1.5px solid var(--border);
        border-radius: var(--rsm);
        padding: 6px 14px;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.18s,
          border-color 0.18s,
          color 0.18s;
        white-space: nowrap;
      }
      .learn-btn:hover {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .learn-btn svg {
        transition: transform 0.18s;
      }
      .learn-btn:hover svg {
        transform: translateX(2px);
      }
      @media (max-width: 1200px) {
        .course-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 900px) {
        .page-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .header-meta {
          align-items: flex-start;
        }
        .header-counts {
          flex-direction: row;
        }
        .hcount {
          text-align: left;
        }
        .header-info {
          justify-content: flex-start;
        }
        .course-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .card-info {
          grid-template-columns: 1fr;
        }
        .course-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-header">
      <div>
        <div class="page-eyebrow">Course Finder</div>
        <div class="page-title">CCT College <span>Dublin</span></div>
        <div class="page-sub">
          Dublin — Undergraduate &amp; Postgraduate programmes — February &amp;
          September intake
        </div>
      </div>
      <div class="header-meta">
        <div class="header-counts">
          <div class="hcount">
            <div class="hcount-num" id="statTotal">—</div>
            <div class="hcount-lbl">Programmes</div>
          </div>
          <div class="hcount">
            <div class="hcount-num" id="statFields">—</div>
            <div class="hcount-lbl">Fields</div>
          </div>
        </div>
        <div class="header-info">
          <span class="hinfo-pill">Application Fee <strong>€50</strong></span>
          <span class="hinfo-pill">Website <strong>cct.ie</strong></span>
        </div>
      </div>
    </div>

    <div class="main">
      <div id="courseContainer"></div>
    </div>

    <script>
      const SCORES = {
        Undergraduate: {
          ielts: "6.0",
          toefl: "68–73",
          pte: "50",
          det: "105–115",
        },
        Postgraduate: {
          ielts: "6.5",
          toefl: "80–85",
          pte: "58",
          det: "120–125",
        },
      };

      const COURSES = [
        {
          name: "Bachelor of Arts (Honours) in Business",
          award: "BA (Hons)",
          field: "Business",
          level: "Undergraduate",
          fee: "€8,600",
          feeNote: "Years 2 & 3: €4,500/yr",
          dur: "3 Years",
          feb: true,
          sep: true,
        },
        {
          name: "MA in International Business",
          award: "MA",
          field: "Business",
          level: "Postgraduate",
          fee: "€12,000",
          feeNote: null,
          dur: "14 Months",
          feb: true,
          sep: true,
        },
        {
          name: "Bachelor of Science (Honours) in Computing and IT",
          award: "BSc (Hons)",
          field: "Computing & IT",
          level: "Undergraduate",
          fee: "€8,600",
          feeNote: "Years 2–4: €5,000/yr",
          dur: "4 Years",
          feb: false,
          sep: true,
        },
        {
          name: "Master of Science (MSc) in Applied Software Development",
          award: "MSc",
          field: "Computing & IT",
          level: "Postgraduate",
          fee: "€14,000",
          feeNote: null,
          dur: "14 Months",
          feb: true,
          sep: true,
        },
        {
          name: "Master of Science (MSc) in Cybersecurity",
          award: "MSc",
          field: "Computing & IT",
          level: "Postgraduate",
          fee: "€14,000",
          feeNote: null,
          dur: "14 Months",
          feb: true,
          sep: true,
        },
        {
          name: "Master of Science (MSc) in Computing",
          award: "MSc",
          field: "Computing & IT",
          level: "Postgraduate",
          fee: "€14,000",
          feeNote: null,
          dur: "14 Months",
          feb: true,
          sep: true,
        },
        {
          name: "Master of Science (MSc) in Data Analytics",
          award: "MSc",
          field: "Computing & IT",
          level: "Postgraduate",
          fee: "€14,000",
          feeNote: null,
          dur: "14 Months",
          feb: true,
          sep: true,
        },
      ];

      const FIELD_COLOR = {
        Business: "#1E40AF",
        "Computing & IT": "#6D28D9",
      };

      const ARROW = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      function renderCourses() {
        const fields = [...new Set(COURSES.map((c) => c.field))];
        document.getElementById("statTotal").textContent = COURSES.length;
        document.getElementById("statFields").textContent = fields.length;

        const container = document.getElementById("courseContainer");
        const grouped = {};
        
        COURSES.forEach((c) => {
          if (!grouped[c.field]) grouped[c.field] = [];
          grouped[c.field].push(c);
        });

        container.innerHTML = Object.keys(grouped)
          .map((fieldName) => {
            const courses = grouped[fieldName];
            const cards = courses.map((c) => {
              const sc = SCORES[c.level];
              const lvlCls = c.level === "Undergraduate" ? "award-ug" : "award-pg";
              const openMonths = [];
              if (c.feb) openMonths.push("Feb");
              if (c.sep) openMonths.push("Sep");
              const intakeBadges = openMonths
                .map((m) => `<span class="intake-badge intake-open">${m}</span>`)
                .join("");

              return `
                <div class="course-card">
                  <div class="card-top">
                    <span class="card-award ${lvlCls}">${c.award}</span>
                  </div>
                  <div class="course-name">${c.name}</div>
                  <div class="card-info">
                    <div class="info-item">
                      <div class="info-label">Tuition Fee</div>
                      <div class="info-value fee-val">${c.fee}</div>
                      ${c.feeNote ? `<div class="info-note">${c.feeNote}</div>` : ""}
                    </div>
                    <div class="info-item">
                      <div class="info-label">Application Fee</div>
                      <div class="info-value">€50</div>
                    </div>
                    <div class="info-item">
                      <div class="info-label">Duration</div>
                      <div class="info-value">${c.dur}</div>
                    </div>
                    <div class="info-item">
                      <div class="info-label">Intake</div>
                      <div class="info-value"><div class="intake-row">${intakeBadges}</div></div>
                    </div>
                  </div>
                  <div class="test-section">
                    <div class="info-label" style="margin-bottom:7px;">English Requirements</div>
                    <div class="score-grid">
                      <div class="score-item"><span class="score-label">IELTS</span><span class="score-val">${sc.ielts}</span></div>
                      <div class="score-item"><span class="score-label">TOEFL</span><span class="score-val">${sc.toefl}</span></div>
                      <div class="score-item"><span class="score-label">PTE</span><span class="score-val">${sc.pte}</span></div>
                      <div class="score-item"><span class="score-label">DET</span><span class="score-val">${sc.det}</span></div>
                    </div>
                  </div>
                  <div class="card-divider"></div>
                  <div class="card-footer">
                    <a href="https://www.cct.ie/course-delivery/full-time/" target="_blank" rel="noopener noreferrer" class="learn-btn">
                      Learn More ${ARROW}
                    </a>
                  </div>
                </div>`;
            }).join("");

            return `
              <div class="field-section">
                <div class="field-header">
                  <div class="field-dot"></div>
                  <div class="field-name">${fieldName}</div>
                  <span class="field-count">${courses.length} programmes</span>
                </div>
                <div class="course-grid">${cards}</div>
              </div>`;
          }).join("");
      }

      renderCourses();
    </script>
  </body>
</html>
