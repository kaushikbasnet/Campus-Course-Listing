<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University of Limerick – Programs</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Mulish:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #005f86;
        --brand-dark: #003d56;
        --brand-light: #e6f2f7;
        --accent: #f5a623;
        --bg: #f0f6f9;
        --card-bg: #ffffff;
        --text: #0d2233;
        --muted: #4a6070;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Mulish", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .hero {
        background: linear-gradient(
          135deg,
          #005f86 0%,
          #003d56 55%,
          #001824 100%
        );
        color: white;
        padding: 60px 40px 50px;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        bottom: -40px;
        right: -40px;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        background: rgba(245, 166, 35, 0.12);
      }
      .hero::after {
        content: "";
        position: absolute;
        top: 20px;
        right: 15%;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.04);
      }
      .hero-inner {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
      }
      .hero-tag {
        display: inline-block;
        border-left: 4px solid var(--accent);
        padding-left: 12px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 18px;
      }
      .hero h1 {
        font-family: "Sora", sans-serif;
        font-size: clamp(28px, 5vw, 52px);
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: 14px;
      }
      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 22px;
      }
      .hero-meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, 0.8);
      }
      .hero-meta-item i {
        color: var(--accent);
      }
      .hero-meta-item a {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: underline;
      }

      .wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px 60px;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 50px 0 20px;
      }
      .section-label h2 {
        font-family: "Sora", sans-serif;
        font-size: 19px;
        font-weight: 700;
        color: var(--brand);
        white-space: nowrap;
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(to right, var(--brand-light), transparent);
      }

      .course-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 18px;
      }

      .course-card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 20px;
        border-bottom: 4px solid var(--brand);
        box-shadow: 0 2px 12px rgba(0, 95, 134, 0.08);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        display: flex;
        flex-direction: column;
      }
      .course-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(0, 95, 134, 0.15);
      }

      .course-title {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        margin-bottom: 12px;
      }
      .detail {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .detail i {
        color: var(--brand);
        width: 14px;
      }
      .faculty-badge {
        display: inline-block;
        background: var(--brand-light);
        color: var(--brand-dark);
        font-size: 10.5px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 10px;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .btn-group {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 14px;
      }
      .btn {
        flex: 1;
        padding: 9px 8px;
        border-radius: 7px;
        text-align: center;
        text-decoration: none;
        font-weight: 600;
        font-size: 12px;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-primary {
        background: var(--brand);
        color: white;
      }
      .btn-secondary {
        background: var(--brand-light);
        color: var(--brand);
      }
    </style>
  </head>
