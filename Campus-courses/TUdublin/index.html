      rel="stylesheet"

      :root {
        --navy: #001d3d;
        --blue: #004f9f;
        --mid: #0066cc;
        --bg: #f2f5f9;
        --surface: #ffffff;
        --surf2: #ebf0f7;
        --border: rgba(0, 79, 159, 0.13);
        --text: #0f172a;
        --muted: #5e7491;
        --light: #94a3b8;
        --radius: 12px;
        --rsm: 8px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      /* ── PAGE HEADER ── */
      .page-header {
        background: #eef3fa;
        border-bottom: 1px solid rgba(0, 79, 159, 0.15);
        padding: 28px 5% 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      .page-eyebrow {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .page-title {
        font-family: "Syne", sans-serif;
        font-size: clamp(1.4rem, 2.5vw, 1.9rem);
        font-weight: 800;
        color: var(--navy);
        letter-spacing: -0.01em;
        line-height: 1.15;
      }
      .page-title span {
        color: var(--blue);
      }
      .page-sub {
        margin-top: 5px;
        font-size: 0.82rem;
        color: var(--muted);
        font-weight: 300;
      }
      .header-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .header-counts {
        display: flex;
        gap: 24px;
      }
      .hcount {
        text-align: right;
      }
      .hcount-num {
        font-family: "Syne", sans-serif;
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--navy);
        line-height: 1;
      }
      .hcount-lbl {
        font-size: 0.62rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 2px;
      }
      .header-info {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .hinfo-pill {
        font-size: 0.68rem;
        font-weight: 500;
        color: var(--muted);
        background: rgba(0, 79, 159, 0.07);
        border: 1px solid rgba(0, 79, 159, 0.15);
        padding: 4px 12px;
        border-radius: 100px;
        white-space: nowrap;
      }
      .hinfo-pill strong {
        color: var(--navy);
      }

      /* ── FILTERS BAR ── */
      .filters-wrap {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 12px rgba(0, 29, 61, 0.07);
      }
      .filters-inner {
        margin: 0 auto;
        padding: 14px 5%;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .filters-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        white-space: nowrap;
        margin-right: 4px;
      }
      .filter-select {
        position: relative;
        flex-shrink: 0;
      }
      .filter-select select {
        appearance: none;
        -webkit-appearance: none;
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: var(--rsm);
        padding: 9px 32px 9px 13px;
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .filter-select select:focus {
        border-color: var(--mid);
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
      }
      .filter-select::after {
        content: "";
        position: absolute;
        right: 11px;
        top: 50%;
        transform: translateY(-50%);
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 5px solid var(--muted);
        pointer-events: none;
      }
      .results-count {
        margin-left: auto;
        font-size: 0.75rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .results-count strong {
        color: var(--blue);
        font-weight: 600;
      }

      /* ── MAIN ── */
      .main {
        margin: 0 auto;
        padding: 28px 5% 80px;
      }

      /* ── FIELD SECTION ── */
      .field-section {
        margin-bottom: 38px;
      }
      .field-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
      }
      .field-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #16a34a;
      }
      .field-name {
        font-family: "Syne", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: var(--navy);
      }
      .field-count {
        font-size: 0.67rem;
        font-weight: 600;
        color: var(--muted);
        background: var(--surf2);
        padding: 3px 9px;
        border-radius: 100px;
      }

      /* ── COURSE GRID ── */
      .course-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }

      /* ── COURSE CARD ── */
      .course-card {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 20px 20px 16px;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          border-color 0.2s;
        position: relative;
        overflow: hidden;
      }
      .course-card::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: #16a34a;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .course-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(22, 163, 74, 0.12);
        border-color: rgba(22, 163, 74, 0.35);
      }
      .course-card:hover::after {
        opacity: 1;
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .card-award {
        font-size: 0.62rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 3px 9px;
        border-radius: 100px;
        background: var(--surf2);
        color: var(--muted);
        white-space: nowrap;
      }
      .card-location {
        font-size: 0.62rem;
        color: var(--light);
        font-weight: 400;
        text-align: right;
        line-height: 1.3;
      }

      .course-name {
        font-family: "Syne", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1.45;
        margin-bottom: 16px;
        flex: 1;
      }

      /* info grid 2x3 */
      .card-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 12px;
        margin-bottom: 14px;
      }
      .info-label {
        font-size: 0.58rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--light);
        margin-bottom: 3px;
      }
      .info-value {
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text);
        line-height: 1.35;
      }
      .fee-val {
        color: var(--blue);
        font-weight: 600;
      }
      .info-na {
        color: var(--light);
        font-style: italic;
        font-size: 0.75rem;
      }

      /* intake inline inside info grid */
      .intake-row {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .intake-badge {
        font-size: 0.65rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 5px;
        border: 1px solid;
      }
      .intake-open {
        background: #f0fdf4;
        color: #166534;
        border-color: #bbf7d0;
      }

      /* English test score section */
      .test-section {
        margin-bottom: 14px;
      }
      .score-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .score-item {
        background: var(--surf2);
        border-radius: 6px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .score-label {
        font-size: 0.55rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--light);
      }
      .score-val {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text);
      }
      .score-na {
        font-size: 0.75rem;
        color: var(--light);
        font-style: italic;
      }

      .card-divider {
        height: 1px;
        background: var(--border);
        margin-bottom: 12px;
      }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
      .learn-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--blue);
        background: transparent;
        border: 1.5px solid var(--border);
        border-radius: var(--rsm);
        padding: 6px 14px;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.18s,
          border-color 0.18s,
          color 0.18s;
        white-space: nowrap;
      }
      .learn-btn:hover {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .learn-btn svg {
        transition: transform 0.18s;
      }
      .learn-btn:hover svg {
        transform: translateX(2px);
      }

      /* no results */
      #noResults {
        display: none;
        text-align: center;
        padding: 80px 20px;
        color: var(--muted);
      }
      #noResults h3 {
        font-family: "Syne", sans-serif;
        font-size: 1.1rem;
        color: var(--text);
        margin-bottom: 8px;
      }
      #noResults p {
        font-size: 0.85rem;
      }

      @media (max-width: 1200px) {
        .course-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 900px) {
        .page-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .header-meta {
          align-items: flex-start;
        }
        .header-counts {
          flex-direction: row;
        }
        .hcount {
          text-align: left;
        }
        .header-info {
          justify-content: flex-start;
        }
        .course-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .filters-inner {
          gap: 8px;
        }
        .card-info {
          grid-template-columns: 1fr;
        }
        .course-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

        <div class="filter-select">

            <option value="jan">January 2026</option>
            <option value="sep">September 2026</option>

        </div>

        <div class="filter-select">
          <select id="feeFilter" onchange="applyFilters()">
            <option value="">Any Tuition Fee</option>
            <option value="under12">Under €12,000</option>
            <option value="12to15">€12,000 – €15,000</option>
            <option value="over15">Over €15,000</option>
          </select>
        </div>

        <div class="filter-select">
          <select id="durationFilter" onchange="applyFilters()">
            <option value="">Any Duration</option>
            <option value="1">1 Year</option>
            <option value="1.5">1.5 Years</option>
            <option value="2">2 Years</option>
          </select>
        </div>

        <div class="results-count" id="resultsCount"></div>
      </div>
    </div>

        {

          duration: "8 Weeks",

          jan: false,
          sep: false,
          location: "AST",
          july: true,
        },
      ];

      const FIELD_COLOR = {
        "Architecture & Built Environment": "#B45309",
        Business: "#1E40AF",
        "Computing, Digital & Data": "#6D28D9",
        "Creative Arts, Design & Media": "#9D174D",
        "Culinary, Hospitality & Tourism": "#B91C1C",
        Engineering: "#0E7490",
        Law: "#7C3AED",
        "Music & Drama": "#0F766E",
        "Sciences & Health": "#065F46",
        "Social Sciences & Education": "#4338CA",
        "Bridging & Pre-Sessional": "#78716C",
      };

      // Populate field dropdown
      const fields = [...new Set(COURSES.map((c) => c.field))];
      const fieldSel = document.getElementById("fieldFilter");
      fields.forEach((f) => {
        const o = document.createElement("option");
        o.value = f;
        o.textContent = f;
        fieldSel.appendChild(o);
      });

      // Stats
      document.getElementById("statTotal").textContent = COURSES.length;
      document.getElementById("statFields").textContent = fields.length;

      const fmt = (fee) => (fee ? "€" + fee.toLocaleString() : null);

      function feeMatch(fee, f) {
        if (!f) return true;
        if (!fee) return false;
        if (f === "under12") return fee < 12000;
        if (f === "12to15") return fee >= 12000 && fee <= 15000;
        if (f === "over15") return fee > 15000;
        return true;
      }

      function intakeMatch(c, f) {
        if (!f) return true;
        if (f === "jan") return c.jan === true;
        if (f === "sep") return c.sep === true;
        return true;
      }

      function durMatch(c, f) {
        if (!f) return true;
        if (f === "1")
          return c.duration === "1 Year" || c.duration === "8 Weeks";
        if (f === "1.5")
          return c.duration === "1.5 Years" || c.duration === "1–1.5 Years";
        if (f === "2") return c.duration === "2 Years";
        return true;
      }

      const ARROW = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      function applyFilters() {
        const field = document.getElementById("fieldFilter").value;
        const intake = document.getElementById("intakeFilter").value;
        const fee = document.getElementById("feeFilter").value;
        const duration = document.getElementById("durationFilter").value;

        const filtered = COURSES.filter((c) => {
          if (field && c.field !== field) return false;
          if (!intakeMatch(c, intake)) return false;
          if (!feeMatch(c.fee, fee)) return false;
          if (!durMatch(c, duration)) return false;
          return true;
        });

        document.getElementById("resultsCount").innerHTML =
          `<strong>${filtered.length}</strong> programme${filtered.length !== 1 ? "s" : ""} found`;

        const container = document.getElementById("courseContainer");
        const noRes = document.getElementById("noResults");

        if (filtered.length === 0) {
          container.innerHTML = "";
          noRes.style.display = "block";
          return;
        }
        noRes.style.display = "none";

        // Group by field preserving order
        const grouped = {};
        const order = [];
        filtered.forEach((c) => {
          if (!grouped[c.field]) {
            grouped[c.field] = [];
            order.push(c.field);
          }
          grouped[c.field].push(c);
        });

        container.innerHTML = order
          .map((fieldName) => {
            const color = FIELD_COLOR[fieldName] || "#1E40AF";
            const courses = grouped[fieldName];

            const cards = courses
              .map((c) => {
                const feeStr = fmt(c.fee);
                // IELTS → TOEFL / PTE / DET equivalents
                const SCORE_MAP = {
                  5.5: { toefl: 46, pte: 42, det: 85 },
                  6.0: { toefl: 60, pte: 50, det: 95 },
                  6.5: { toefl: 79, pte: 58, det: 110 },
                  7.0: { toefl: 94, pte: 65, det: 120 },
                  7.5: { toefl: 102, pte: 73, det: 130 },
                };
                const scoreRow = c.ielts
                  ? (() => {
                      const eq = SCORE_MAP[c.ielts] || {};
                      return `
              <div class="score-grid">
                <div class="score-item"><span class="score-label">IELTS</span><span class="score-val">${c.ielts.toFixed(1)}</span></div>
                <div class="score-item"><span class="score-label">TOEFL</span><span class="score-val">${eq.toefl || "—"}</span></div>
                <div class="score-item"><span class="score-label">PTE</span><span class="score-val">${eq.pte || "—"}</span></div>
                <div class="score-item"><span class="score-label">DET</span><span class="score-val">${eq.det || "—"}</span></div>
              </div>`;
                    })()
                  : `<div class="score-na">Not stated</div>`;

                // Intake — show only open months as simple text badges
                const openMonths = [];
                if (c.july) openMonths.push("July");
                if (c.jan) openMonths.push("Jan");
                if (c.sep) openMonths.push("Sep");
                const intakeBadges = openMonths
                  .map(
                    (m) => `<span class="intake-badge intake-open">${m}</span>`,
                  )
                  .join("");

                return `
        <div class="course-card" style="--card-color:${color};">
          <div class="card-top">
            <span class="card-award">${c.award}</span>
            <span class="card-location">${c.location}</span>
          </div>
          <div class="course-name">${c.name}</div>
          <div class="card-info">
            <div class="info-item">
              <div class="info-label">Tuition Fee</div>
              <div class="info-value fee-val">${feeStr || '<span class="info-na">On request</span>'}</div>
            </div>
            <div class="info-item">
              <div class="info-label">Application Fee</div>
              <div class="info-value">€50</div>
            </div>
            <div class="info-item">
              <div class="info-label">Duration</div>
              <div class="info-value">${c.duration}</div>
            </div>
            <div class="info-item">
              <div class="info-label">Intake</div>
              <div class="info-value"><div class="intake-row">${intakeBadges}</div></div>
            </div>
          </div>
          <div class="test-section">
            <div class="info-label" style="margin-bottom:7px;">English Test Requirements</div>
            ${scoreRow}
          </div>
          <div class="card-divider"></div>
          <div class="card-footer">
            <a href="https://www.tudublin.ie/" target="_blank" rel="noopener noreferrer" class="learn-btn">
              Learn More ${ARROW}
            </a>
          </div>
        </div>`;
              })
              .join("");

            return `
      <div class="field-section">
        <div class="field-header">
          <div class="field-dot" style="--field-color:${color};"></div>
          <div class="field-name">${fieldName}</div>
          <span class="field-count">${courses.length} programme${courses.length !== 1 ? "s" : ""}</span>
        </div>
        <div class="course-grid">${cards}</div>
      </div>`;
          })
          .join("");
      }

      applyFilters();
    </script>
