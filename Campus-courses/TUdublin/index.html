      :root {
        --navy: #001d3d;
        --blue: #004f9f;
        --mid: #0066cc;
        --bg: #f2f5f9;
        --surface: #ffffff;
        --surf2: #ebf0f7;
        --border: rgba(0, 79, 159, 0.13);
        --text: #0f172a;
        --muted: #5e7491;
        --light: #94a3b8;
        --radius: 12px;
        --rsm: 8px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }

      /* ── PAGE HEADER ── */
      .page-header {
        background: #eef3fa;
        border-bottom: 1px solid rgba(0, 79, 159, 0.15);
        padding: 28px 5% 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      .page-eyebrow {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .page-title {
        font-family: "Syne", sans-serif;
        font-size: clamp(1.4rem, 2.5vw, 1.9rem);
        font-weight: 800;
        color: var(--navy);
        letter-spacing: -0.01em;
        line-height: 1.15;
      }
      .page-title span {
        color: var(--blue);
      }
      .page-sub {
        margin-top: 5px;
        font-size: 0.82rem;
        color: var(--muted);
        font-weight: 300;
      }
      .header-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .header-counts {
        display: flex;
        gap: 24px;
      }
      .hcount {
        text-align: right;
      }
      .hcount-num {
        font-family: "Syne", sans-serif;
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--navy);
        line-height: 1;
      }
      .hcount-lbl {
        font-size: 0.62rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 2px;
      }
      .header-info {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .hinfo-pill {
        font-size: 0.68rem;
        font-weight: 500;
        color: var(--muted);
        background: rgba(0, 79, 159, 0.07);
        border: 1px solid rgba(0, 79, 159, 0.15);
        padding: 4px 12px;
        border-radius: 100px;
        white-space: nowrap;
      }
      .hinfo-pill strong {
        color: var(--navy);
      }

      /* ── MAIN ── */
      .main {
        margin: 0 auto;
        padding: 28px 5% 80px;
      }

      /* ── FIELD SECTION ── */
      .field-section {
        margin-bottom: 38px;
      }
      .field-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
      }
      .field-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #16a34a;
      }
      .field-name {
        font-family: "Syne", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: var(--navy);
      }
      .field-count {
        font-size: 0.67rem;
        font-weight: 600;
        color: var(--muted);
        background: var(--surf2);
        padding: 3px 9px;
        border-radius: 100px;
      }

      /* ── COURSE GRID ── */
      .course-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }

      /* ── COURSE CARD ── */
      .course-card {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 20px 20px 16px;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          border-color 0.2s;
        position: relative;
        overflow: hidden;
      }
      .course-card::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: #16a34a;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .course-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(22, 163, 74, 0.12);
        border-color: rgba(22, 163, 74, 0.35);
      }
      .course-card:hover::after {
        opacity: 1;
      }

      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .card-award {
        font-size: 0.62rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 3px 9px;
        border-radius: 100px;
        background: var(--surf2);
        color: var(--muted);
        white-space: nowrap;
      }
      .card-location {
        font-size: 0.62rem;
        color: var(--light);
        font-weight: 400;
        text-align: right;
        line-height: 1.3;
      }

      .course-name {
        font-family: "Syne", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1.45;
        margin-bottom: 16px;
        flex: 1;
      }

      /* info grid 2x3 */
      .card-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 12px;
        margin-bottom: 14px;
      }
      .info-label {
        font-size: 0.58rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--light);
        margin-bottom: 3px;
      }
      .info-value {
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text);
        line-height: 1.35;
      }
      .fee-val {
        color: var(--blue);
        font-weight: 600;
      }
      .info-na {
        color: var(--light);
        font-style: italic;
        font-size: 0.75rem;
      }

      .intake-row {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .intake-badge {
        font-size: 0.65rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 5px;
        border: 1px solid;
      }
      .intake-open {
        background: #f0fdf4;
        color: #166534;
        border-color: #bbf7d0;
      }

      .test-section {
        margin-bottom: 14px;
      }
      .score-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .score-item {
        background: var(--surf2);
        border-radius: 6px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .score-label {
        font-size: 0.55rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--light);
      }
      .score-val {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text);
      }
      .score-na {
        font-size: 0.75rem;
        color: var(--light);
        font-style: italic;
      }

      .card-divider {
        height: 1px;
        background: var(--border);
        margin-bottom: 12px;
      }

      .card-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
      .learn-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--blue);
        background: transparent;
        border: 1.5px solid var(--border);
        border-radius: var(--rsm);
        padding: 6px 14px;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.18s,
          border-color 0.18s,
          color 0.18s;
        white-space: nowrap;
      }
      .learn-btn:hover {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }

      @media (max-width: 1200px) {
        .course-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 900px) {
        .page-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .header-meta {
          align-items: flex-start;
        }
        .course-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .card-info {
          grid-template-columns: 1fr;
        }
        .course-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

          fee: 9000,
          duration: "1 Year",
          ielts: 6.5,
          jan: false,
          sep: true,
          location: "Grangegorman",
        },
        {
          name: "Criminology",
          award: "MA",
          field: "Social Sciences & Education",
          fee: 13500,
          duration: "1 Year",
          ielts: 6.5,
          jan: false,
          sep: true,
          location: "Grangegorman",
        },
        {
          name: "International Postgraduate Bridging Programme",
          award: "N/A",
          field: "Bridging & Pre-Sessional",
          fee: 3500,
          duration: "8 Weeks",
          ielts: 5.5,
          jan: false,
          sep: false,
          location: "AST",
          july: true,
        },
      ];

      const FIELD_COLOR = {
        "Architecture & Built Environment": "#B45309",
        Business: "#1E40AF",
        "Computing, Digital & Data": "#6D28D9",
        "Creative Arts, Design & Media": "#9D174D",
        "Culinary, Hospitality & Tourism": "#B91C1C",
        Engineering: "#0E7490",
        Law: "#7C3AED",
        "Music & Drama": "#0F766E",
        "Sciences & Health": "#065F46",
        "Social Sciences & Education": "#4338CA",
        "Bridging & Pre-Sessional": "#78716C",
      };

      const fields = [...new Set(COURSES.map((c) => c.field))];
      document.getElementById("statTotal").textContent = COURSES.length;
      document.getElementById("statFields").textContent = fields.length;

      const fmt = (fee) => (fee ? "€" + fee.toLocaleString() : null);
      const ARROW = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      function render() {
        const container = document.getElementById("courseContainer");
        container.innerHTML = "";

        const grouped = {};
        COURSES.forEach((c) => {
          if (!grouped[c.field]) grouped[c.field] = [];
          grouped[c.field].push(c);
        });

        Object.keys(grouped).sort().forEach((f) => {
          const section = document.createElement("div");
          section.className = "field-section";

          section.innerHTML = `
            <div class="field-header">
              <div class="field-dot" style="background:${FIELD_COLOR[f] || "#333"}"></div>
              <div class="field-name">${f}</div>
              <div class="field-count">${grouped[f].length}</div>
            </div>
            <div class="course-grid">
              ${grouped[f].map((c) => `
                <div class="course-card">
                  <div class="card-top">
                    <span class="card-award">${c.award}</span>
                    <span class="card-location">${c.location}</span>
                  </div>
                  <div class="course-name">${c.name}</div>
                  
                  <div class="card-info">
                    <div>
                      <div class="info-label">Intake</div>
                      <div class="intake-row">
                        ${c.sep ? '<span class="intake-badge intake-open">SEP</span>' : ""}
                        ${c.jan ? '<span class="intake-badge intake-open">JAN</span>' : ""}
                        ${c.july ? '<span class="intake-badge intake-open">JULY</span>' : ""}
                      </div>
                    </div>
                    <div>
                      <div class="info-label">Duration</div>
                      <div class="info-value">${c.duration}</div>
                    </div>
                    <div>
                      <div class="info-label">Tuition Fee</div>
                      <div class="info-value fee-val">${fmt(c.fee) || '<span class="info-na">N/A</span>'}</div>
                    </div>
                  </div>

                  <div class="test-section">
                    <div class="info-label">Min. IELTS Score</div>
                    <div class="score-grid">
                      <div class="score-item">
                        <div class="score-label">Avg</div>
                        <div class="score-val">${c.ielts || "—"}</div>
                      </div>
                    </div>
                  </div>

                  <div class="card-divider"></div>
                  <div class="card-footer">
                    <a href="#" class="learn-btn">Details ${ARROW}</a>
                  </div>
                </div>
              `).join("")}
            </div>
          `;
          container.appendChild(section);
        });
      }

      render();
    </script>
  </body>
</html>
