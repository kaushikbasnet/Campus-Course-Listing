    <style>
      :root {
        --brand: #00843d;
        --brand-light: #e6f4ec;
        --accent: #00a651;
        --bg: #f4f6fb;
        --card-bg: #ffffff;
        --text: #1a1a2e;
        --muted: #5a6175;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Source Sans 3", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* HERO */
      .hero {
        background: linear-gradient(135deg, #00843d, #004d26, #002a14);
        color: white;
        padding: 60px 40px 50px;
      }

      .hero-inner {
        max-width: 1200px;
        margin: auto;
      }

      .hero-tag {
        background: var(--accent);
        font-size: 11px;
        padding: 5px 14px;
        border-radius: 4px;
        margin-bottom: 18px;
        display: inline-block;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .hero-title-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 16px;
      }
      .hero-logo {
        width: 150px;
        height: 100px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        flex-shrink: 0;
      }

      .hero-title-row h1 {
        font-size: clamp(26px, 4vw, 48px);
        font-weight: 800;
      }

      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        margin-top: 24px;
      }

      .hero-meta-item {
        display: flex;
        gap: 8px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.85);
      }

      /* WRAPPER */
      .wrapper {
        max-width: 1200px;
        margin: auto;
        padding: 40px 24px 60px;
      }

      /* SECTION */
      .section-label {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 48px 0 20px;
      }
      .section-label h2 {
        font-size: 22px;
        font-weight: 700;
        color: var(--brand);
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(to right, var(--brand-light), transparent);
      }

      /* GRID */
      .course-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 18px;
      }

      /* CARD */
      .course-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        border-left: 5px solid var(--brand);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
        display: flex;
        flex-direction: column;
      }

      .course-title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 12px;
      }

      .detail {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .badge {
        display: inline-block;
        background: var(--brand-light);
        color: var(--brand);
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 20px;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .btn-group {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 14px;
      }

      .btn {
        flex: 1;
        padding: 9px;
        text-align: center;
        border-radius: 7px;
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
      }

      .btn-primary {
        background: var(--brand);
        color: white;
      }
      .btn-secondary {
        background: #eef1f8;
        color: var(--brand);
      }
    </style>
  </head>
