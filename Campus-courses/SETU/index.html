    <style>
      :root {
        --brand: #003087;
        --brand-light: #e8edf7;
        --accent: #e63312;
        --bg: #f4f6fb;
        --card-bg: #ffffff;
        --text: #1a1a2e;
        --muted: #5a6175;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Source Sans 3", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* HERO */
      .hero {
        background: linear-gradient(
          135deg,
          #003087 0%,
          #001a4d 60%,
          #0a0a2e 100%
        );
        color: white;
        padding: 60px 40px 50px;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        top: -60px;
        right: -60px;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: rgba(230, 51, 18, 0.18);
      }
      .hero::after {
        content: "";
        position: absolute;
        bottom: -80px;
        left: 10%;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
      }
      .hero-inner {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
      }
      .hero-tag {
        display: inline-block;
        background: var(--accent);
        color: white;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 5px 14px;
        border-radius: 4px;
        margin-bottom: 18px;
      }

      /* LOGO + NAME ROW */
      .hero-title-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 16px;
      }
      .hero-logo {
        width: 150px;
        height: 100px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        flex-shrink: 0;
      }
      .hero-title-row h1 {
        font-family: "Raleway", sans-serif;
        font-size: clamp(24px, 4vw, 48px);
        font-weight: 800;
        line-height: 1.15;
      }

      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        margin-top: 24px;
      }
      .hero-meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }
      .hero-meta-item i {
        color: var(--accent);
      }
      .hero-meta-item a {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: underline;
      }

      /* WRAPPER */
      .wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px 60px;
      }

      /* SECTION */
      .section-label {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 48px 0 20px;
      }
      .section-label h2 {
        font-family: "Raleway", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--brand);
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(to right, var(--brand-light), transparent);
      }

      /* GRID */
      .course-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 18px;
        margin-bottom: 12px;
      }

      /* CARD */
      .course-card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 20px;
        border-left: 5px solid var(--brand);
        box-shadow: 0 2px 12px rgba(0, 48, 135, 0.07);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        display: flex;
        flex-direction: column;
      }
      .course-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(0, 48, 135, 0.13);
      }
      .course-title {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        margin-bottom: 12px;
        color: var(--text);
      }
      .detail {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .detail i {
        color: var(--brand);
        width: 14px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        background: var(--brand-light);
        color: var(--brand);
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 20px;
        margin-bottom: 10px;
      }
      .btn-group {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 14px;
      }
      .btn {
        flex: 1;
        padding: 9px 8px;
        border-radius: 7px;
        text-align: center;
        text-decoration: none;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.3px;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-primary {
        background: var(--brand);
        color: white;
      }
      .btn-secondary {
        background: #eef1f8;
        color: var(--brand);
      }
      .pg-badge {
        display: inline-block;
        background: var(--accent);
        color: white;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 2px 8px;
        border-radius: 20px;
        margin-bottom: 10px;
      }
    </style>
