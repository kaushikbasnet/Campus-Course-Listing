<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Independent College – Programs</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --brand: #1e3a8a;
        --brand-light: #e0e7ff;
        --accent: #d97706;
        --bg: #f4f6fb;
        --card-bg: #fff;
        --text: #1a1a2e;
        --muted: #5a6175;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Source Sans 3", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* SAME HERO */
      .hero {
        background: linear-gradient(135deg, #1e3a8a, #111827, #000);
        color: white;
        padding: 60px 40px 50px;
        position: relative;
        overflow: hidden;
      }
      .hero::before,
      .hero::after {
        content: "";
        position: absolute;
        border-radius: 50%;
      }
      .hero::before {
        top: -60px;
        right: -60px;
        width: 300px;
        height: 300px;
        background: rgba(255, 255, 255, 0.1);
      }
      .hero::after {
        bottom: -80px;
        left: 10%;
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.05);
      }
      .hero-inner {
        max-width: 1200px;
        margin: auto;
        position: relative;
        z-index: 2;
      }
      .hero-tag {
        background: var(--accent);
        font-size: 11px;
        padding: 5px 14px;
        border-radius: 4px;
        margin-bottom: 18px;
        display: inline-block;
      }
      .hero-title-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 16px;
      }
      .hero-logo {
        width: 150px;
        height: 100px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        flex-shrink: 0;
      }
      .hero-title-row h1 {
        font-size: clamp(24px, 4vw, 48px);
        font-weight: 800;
      }
      .hero-meta {
        display: flex;
        gap: 24px;
        margin-top: 24px;
        flex-wrap: wrap;
      }
      .hero-meta-item {
        display: flex;
        gap: 8px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.85);
      }

      .wrapper {
        max-width: 1200px;
        margin: auto;
        padding: 40px 24px 60px;
      }
      .section-label {
        display: flex;
        gap: 14px;
        margin: 48px 0 20px;
      }
      .section-label h2 {
        color: var(--brand);
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(to right, var(--brand-light), transparent);
      }
      .course-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 18px;
      }

      .course-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        border-left: 5px solid var(--brand);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
        display: flex;
        flex-direction: column;
      }
      .course-title {
        font-weight: 600;
        margin-bottom: 12px;
      }
      .detail {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .btn-group {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 14px;
      }
      .btn {
        flex: 1;
        padding: 9px;
        text-align: center;
        font-size: 12px;
        border-radius: 7px;
        text-decoration: none;
      }
      .btn-primary {
        background: var(--brand);
        color: white;
      }
      .btn-secondary {
        background: #eef1f8;
        color: var(--brand);
      }
    </style>
  </head>

  <body>
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-tag">Ireland · Dublin</div>

        <div class="hero-title-row">
          <img
            class="hero-logo"
            src="../independent.avif"
            alt="Independent College Logo"
          />
          <h1>Independent College</h1>
        </div>

        <div class="hero-meta">
          <div class="hero-meta-item">
            <i class="fa-solid fa-calendar-days"></i> Intake: Feb & Sep
          </div>
          <div class="hero-meta-item">
            <i class="fa-solid fa-graduation-cap"></i> UG & PG
          </div>
          <div class="hero-meta-item">
            <i class="fa-solid fa-globe"></i
            ><a href="https://independentcollege.ie/" target="_blank"
              >independentcollege.ie</a
            >
          </div>
        </div>
      </div>
    </div>

    <div class="wrapper" id="app"></div>

    <script>
      const ugSections = [
        {
          title: "Programs",
          pg: false,
          courses: [
            ["BA Marketing", "€7,200", "3 Years", "Dublin"],
            ["BA Accounting & Finance", "€7,200", "3 Years", "Dublin"],
            ["BA Business Studies", "€7,200", "3 Years", "Dublin"],
            ["BA International Business", "€8,000", "3 Years", "Dublin"],
            ["MA Dispute Resolution", "€9,200", "1 Year", "Dublin"],
          ],
        },
      ];

      const app = document.getElementById("app");
      ugSections.forEach((sec) => {
        const lbl = document.createElement("div");
        lbl.className = "section-label";
        lbl.innerHTML = `<h2>${sec.title}</h2>`;
        app.appendChild(lbl);

        const grid = document.createElement("div");
        grid.className = "course-grid";

        sec.courses.forEach((c) => {
          const card = document.createElement("div");
          card.className = "course-card";
          card.innerHTML = `
<div class="course-title">${c[0]}</div>
<div class="detail"><i class="fa-solid fa-euro-sign"></i> ${c[1]}</div>
<div class="detail"><i class="fa-solid fa-clock"></i> ${c[2]}</div>
<div class="detail"><i class="fa-solid fa-location-dot"></i> ${c[3]}</div>
<div class="detail"><i class="fa-solid fa-language"></i> IELTS 6.0+</div>
<div class="btn-group">
<a href="https://independentcollege.ie/" target="_blank" class="btn btn-secondary">Learn More</a>
<a href="#" class="btn btn-primary">Apply Now</a>
</div>`;
          grid.appendChild(card);
        });
        app.appendChild(grid);
      });
    </script>
  </body>
</html>
