<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlantic Technological University – Programs</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800;900&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #006747;
        --brand-dark: #004530;
        --brand-light: #e6f2ed;
        --accent: #00a36c;
        --bg: #f2f8f5;
        --card-bg: #ffffff;
        --text: #0d2018;
        --muted: #4a6357;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Source Sans 3", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .hero {
        background: linear-gradient(
          150deg,
          #006747 0%,
          #004530 50%,
          #002218 100%
        );
        color: white;
        padding: 60px 40px 50px;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 40px,
          rgba(255, 255, 255, 0.015) 40px,
          rgba(255, 255, 255, 0.015) 80px
        );
      }
      .hero-inner {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
      }
      .hero-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(0, 163, 108, 0.25);
        border: 1px solid rgba(0, 163, 108, 0.5);
        color: #7dffc9;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 5px 14px;
        border-radius: 4px;
        margin-bottom: 18px;
      }

      /* LOGO + NAME ROW */
      .hero-title-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 16px;
      }
      .hero-logo {
        width: 150px;
        height: 100px;
        object-fit: contain;
        filter: brightness(0) invert(1);
        flex-shrink: 0;
      }
      .hero-title-row h1 {
        font-family: "Raleway", sans-serif;
        font-size: clamp(24px, 4vw, 48px);
        font-weight: 800;
        line-height: 1.15;
      }

      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        margin-top: 24px;
      }
      .hero-meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
      }
      .hero-meta-item i {
        color: var(--accent);
      }
      .hero-meta-item a {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: underline;
      }

      .hero h1 {
        font-family: "Raleway", sans-serif;
        font-size: clamp(28px, 5vw, 52px);
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 14px;
      }
      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 22px;
      }
      .hero-meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, 0.8);
      }
      .hero-meta-item i {
        color: #7dffc9;
      }
      .hero-meta-item a {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: underline;
      }

      .wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px 60px;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 50px 0 20px;
      }
      .section-label h2 {
        font-family: "Raleway", sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: var(--brand);
        white-space: nowrap;
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(to right, var(--brand-light), transparent);
      }

      .course-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 18px;
      }

      .course-card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 20px;
        border-left: 5px solid var(--brand);
        box-shadow: 0 2px 12px rgba(0, 103, 71, 0.08);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        display: flex;
        flex-direction: column;
      }
      .course-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(0, 103, 71, 0.15);
      }

      .course-title {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        margin-bottom: 12px;
      }
      .detail {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .detail i {
        color: var(--brand);
        width: 14px;
      }
      .campus-badge {
        display: inline-block;
        background: var(--brand-light);
        color: var(--brand-dark);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 10px;
      }

      .btn-group {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 14px;
      }
      .btn {
        flex: 1;
        padding: 9px 8px;
        border-radius: 7px;
        text-align: center;
        text-decoration: none;
        font-weight: 600;
        font-size: 12px;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-primary {
        background: var(--brand);
        color: white;
      }
      .btn-secondary {
        background: var(--brand-light);
        color: var(--brand);
      }
    </style>
  </head>
  <body>
