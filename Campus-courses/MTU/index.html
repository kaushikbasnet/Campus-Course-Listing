<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Munster Technological University — Course Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #001d3d;
        --blue: #004f9f;
        --mid: #0066cc;
        --bg: #f2f5f9;
        --surface: #ffffff;
        --surf2: #ebf0f7;
        --border: rgba(0, 79, 159, 0.13);
        --text: #0f172a;
        --muted: #5e7491;
        --light: #94a3b8;
        --radius: 12px;
        --rsm: 8px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      .page-header {
        background: #eef3fa;
        border-bottom: 1px solid rgba(0, 79, 159, 0.15);
        padding: 28px 5% 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      .page-eyebrow {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .page-title {
        font-family: "Syne", sans-serif;
        font-size: clamp(1.4rem, 2.5vw, 1.9rem);
        font-weight: 800;
        color: var(--navy);
        letter-spacing: -0.01em;
        line-height: 1.15;
      }
      .page-title span {
        color: var(--blue);
      }
      .page-sub {
        margin-top: 5px;
        font-size: 0.82rem;
        color: var(--muted);
        font-weight: 300;
      }
      .header-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      .header-counts {
        display: flex;
        gap: 24px;
      }
      .hcount {
        text-align: right;
      }
      .hcount-num {
        font-family: "Syne", sans-serif;
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--navy);
        line-height: 1;
      }
      .hcount-lbl {
        font-size: 0.62rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-top: 2px;
      }
      .header-info {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .hinfo-pill {
        font-size: 0.68rem;
        font-weight: 500;
        color: var(--muted);
        background: rgba(0, 79, 159, 0.07);
        border: 1px solid rgba(0, 79, 159, 0.15);
        padding: 4px 12px;
        border-radius: 100px;
        white-space: nowrap;
      }
      .hinfo-pill strong {
        color: var(--navy);
      }
      .filters-wrap {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 12px rgba(0, 29, 61, 0.07);
      }
      .filters-inner {
        padding: 14px 5%;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .filters-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        white-space: nowrap;
        margin-right: 4px;
      }
      .filter-select {
        position: relative;
        flex-shrink: 0;
      }
      .filter-select select {
        appearance: none;
        -webkit-appearance: none;
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: var(--rsm);
        padding: 9px 32px 9px 13px;
        font-family: inherit;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .filter-select select:focus {
        border-color: var(--mid);
        box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
      }
      .filter-select::after {
        content: "";
        position: absolute;
        right: 11px;
        top: 50%;
        transform: translateY(-50%);
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 5px solid var(--muted);
        pointer-events: none;
      }
      .results-count {
        margin-left: auto;
        font-size: 0.75rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .results-count strong {
        color: var(--blue);
        font-weight: 600;
      }
      .main {
        padding: 28px 5% 80px;
      }
      .field-section {
        margin-bottom: 38px;
      }
      .field-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--border);
      }
      .field-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
        background: #16a34a;
      }
      .field-name {
        font-family: "Syne", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        color: var(--navy);
      }
      .field-count {
        font-size: 0.67rem;
        font-weight: 600;
        color: var(--muted);
        background: var(--surf2);
        padding: 3px 9px;
        border-radius: 100px;
      }
      .course-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      .course-card {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 20px 20px 16px;
        display: flex;
        flex-direction: column;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          border-color 0.2s;
        position: relative;
        overflow: hidden;
      }
      .course-card::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: #16a34a;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .course-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(22, 163, 74, 0.12);
        border-color: rgba(22, 163, 74, 0.35);
      }
      .course-card:hover::after {
        opacity: 1;
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .card-award {
        font-size: 0.62rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 3px 9px;
        border-radius: 100px;
        background: #f0fdf4;
        color: #166634;
        white-space: nowrap;
      }
      .course-name {
        font-family: "Syne", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1.45;
        margin-bottom: 16px;
        flex: 1;
      }
      .card-info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 12px;
        margin-bottom: 14px;
      }
      .info-label {
        font-size: 0.58rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--light);
        margin-bottom: 3px;
      }
      .info-value {
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text);
        line-height: 1.35;
      }
      .fee-val {
        color: var(--blue);
        font-weight: 600;
      }
      .info-na {
        color: var(--light);
        font-style: italic;
        font-size: 0.75rem;
      }
      .intake-row {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .intake-badge {
        font-size: 0.65rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 5px;
        border: 1px solid;
      }
      .intake-open {
        background: #f0fdf4;
        color: #166534;
        border-color: #bbf7d0;
      }
      .test-section {
        margin-bottom: 14px;
      }
      .score-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .score-item {
        background: var(--surf2);
        border-radius: 6px;
        padding: 6px 8px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .score-label {
        font-size: 0.55rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--light);
      }
      .score-val {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text);
      }
      .card-divider {
        height: 1px;
        background: var(--border);
        margin-bottom: 12px;
      }
      .card-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
      .learn-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--blue);
        background: transparent;
        border: 1.5px solid var(--border);
        border-radius: var(--rsm);
        padding: 6px 14px;
        cursor: pointer;
        text-decoration: none;
        transition:
          background 0.18s,
          border-color 0.18s,
          color 0.18s;
        white-space: nowrap;
      }
      .learn-btn:hover {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }
      .learn-btn svg {
        transition: transform 0.18s;
      }
      .learn-btn:hover svg {
        transform: translateX(2px);
      }
      #noResults {
        display: none;
        text-align: center;
        padding: 80px 20px;
        color: var(--muted);
      }
      #noResults h3 {
        font-family: "Syne", sans-serif;
        font-size: 1.1rem;
        color: var(--text);
        margin-bottom: 8px;
      }
      #noResults p {
        font-size: 0.85rem;
      }
      @media (max-width: 1200px) {
        .course-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 900px) {
        .page-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .header-meta {
          align-items: flex-start;
        }
        .header-counts {
          flex-direction: row;
        }
        .hcount {
          text-align: left;
        }
        .header-info {
          justify-content: flex-start;
        }
        .course-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 600px) {
        .filters-inner {
          gap: 8px;
        }
        .card-info {
          grid-template-columns: 1fr;
        }
        .course-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-header">
      <div>
        <div class="page-eyebrow">Course Finder</div>
        <div class="page-title">
          Munster Technological <span>University</span>
        </div>
        <div class="page-sub">
          Cork &amp; Kerry — Postgraduate programmes — September intake
        </div>
      </div>
      <div class="header-meta">
        <div class="header-counts">
          <div class="hcount">
            <div class="hcount-num" id="statTotal">—</div>
            <div class="hcount-lbl">Programmes</div>
          </div>
          <div class="hcount">
            <div class="hcount-num" id="statFields">—</div>
            <div class="hcount-lbl">Fields</div>
          </div>
        </div>
        <div class="header-info">
          <span class="hinfo-pill">Application Fee <strong>€0</strong></span>
          <span class="hinfo-pill">Website <strong>mtu.ie</strong></span>
        </div>
      </div>
    </div>

    <div class="filters-wrap">
      <div class="filters-inner">
        <span class="filters-label">Filter by</span>
        <div class="filter-select">
          <select id="fieldFilter" onchange="applyFilters()">
            <option value="">All Fields</option>
          </select>
        </div>
        <div class="filter-select">
          <select id="durationFilter" onchange="applyFilters()">
            <option value="">Any Duration</option>
            <option value="1">1 Year</option>
            <option value="2">2 Years</option>
          </select>
        </div>
        <div class="filter-select">
          <select id="feeFilter" onchange="applyFilters()">
            <option value="">Any Tuition Fee</option>
            <option value="stated">€12,000</option>
            <option value="contact">Contact MTU</option>
          </select>
        </div>
        <div class="results-count" id="resultsCount"></div>
      </div>
    </div>

    <div class="main">
      <div id="noResults">
        <h3>No courses found</h3>
        <p>Try adjusting your filters.</p>
      </div>
      <div id="courseContainer"></div>
    </div>

    <script>
      // Postgraduate scores from MTU's official requirements
      // IELTS 6.0 / TOEFL 80 / PTE 51 / DET 100
      const SCORES = { ielts: "6.0", toefl: "80", pte: "51", det: "100" };

      // fee: number or null (contact)
      // dur: "1 Year" | "2 Years"
      const COURSES = [
        // ── Business & Management ──
        {
          name: "MA in Global Business Practice",
          award: "MA",
          field: "Business & Management",
          fee: 12000,
          dur: "1 Year",
        },
        {
          name: "MA in Human Resource Management",
          award: "MA",
          field: "Business & Management",
          fee: 12000,
          dur: "1 Year",
        },
        {
          name: "MSc in Marketing Practice",
          award: "MSc",
          field: "Business & Management",
          fee: 12000,
          dur: "1 Year",
        },
        // ── Arts & Creative ──
        {
          name: "MA Contemporary Art Practice",
          award: "MA",
          field: "Arts & Creative",
          fee: null,
          dur: "1 Year",
        },
        {
          name: "MA in Art and Process",
          award: "MA",
          field: "Arts & Creative",
          fee: 12000,
          dur: "1 Year",
        },
        {
          name: "MA in Art Therapy",
          award: "MA",
          field: "Arts & Creative",
          fee: 12000,
          dur: "2 Years",
        },
        {
          name: "Professional Master of Education (Art and Design)",
          award: "PME",
          field: "Arts & Creative",
          fee: 12000,
          dur: "2 Years",
        },
        // ── Media & Communications ──
        {
          name: "MA in Journalism and Digital Content Creation",
          award: "MA",
          field: "Media & Communications",
          fee: 12000,
          dur: "1 Year",
        },
        {
          name: "MA in Public Relations with New Media",
          award: "MA",
          field: "Media & Communications",
          fee: 12000,
          dur: "1 Year",
        },
        // ── Music ──
        {
          name: "MA in Music (Taught)",
          award: "MA",
          field: "Music",
          fee: 12000,
          dur: "2 Years",
        },
        {
          name: "MA in Music and Technology",
          award: "MA",
          field: "Music",
          fee: 12000,
          dur: "1 Year",
        },
        // ── Engineering ──
        {
          name: "MEng Civil Engineering (Environment and Energy)",
          award: "MEng",
          field: "Engineering",
          fee: 12000,
          dur: "1 Year",
        },
        {
          name: "MEng in Structural Engineering",
          award: "MEng",
          field: "Engineering",
          fee: 12000,
          dur: "1 Year",
        },
      ];

      const FIELD_COLOR = {
        "Business & Management": "#1E40AF",
        "Arts & Creative": "#9D174D",
        "Media & Communications": "#0891B2",
        Music: "#0F766E",
        Engineering: "#0E7490",
      };

      const fields = [...new Set(COURSES.map((c) => c.field))];
      const fieldSel = document.getElementById("fieldFilter");
      fields.forEach((f) => {
        const o = document.createElement("option");
        o.value = f;
        o.textContent = f;
        fieldSel.appendChild(o);
      });

      document.getElementById("statTotal").textContent = COURSES.length;
      document.getElementById("statFields").textContent = fields.length;

      const fmt = (fee) => (fee ? "€" + fee.toLocaleString() : null);

      function durMatch(dur, f) {
        if (!f) return true;
        if (f === "1") return dur === "1 Year";
        if (f === "2") return dur === "2 Years";
        return true;
      }

      function feeMatch(fee, f) {
        if (!f) return true;
        if (f === "stated") return fee !== null;
        if (f === "contact") return fee === null;
        return true;
      }

      const ARROW = `<svg width="12" height="12" fill="none" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

      function applyFilters() {
        const field = document.getElementById("fieldFilter").value;
        const duration = document.getElementById("durationFilter").value;
        const fee = document.getElementById("feeFilter").value;

        const filtered = COURSES.filter((c) => {
          if (field && c.field !== field) return false;
          if (!durMatch(c.dur, duration)) return false;
          if (!feeMatch(c.fee, fee)) return false;
          return true;
        });

        document.getElementById("resultsCount").innerHTML =
          `<strong>${filtered.length}</strong> programme${filtered.length !== 1 ? "s" : ""} found`;

        const container = document.getElementById("courseContainer");
        const noRes = document.getElementById("noResults");
        if (filtered.length === 0) {
          container.innerHTML = "";
          noRes.style.display = "block";
          return;
        }
        noRes.style.display = "none";

        const grouped = {};
        const order = [];
        filtered.forEach((c) => {
          if (!grouped[c.field]) {
            grouped[c.field] = [];
            order.push(c.field);
          }
          grouped[c.field].push(c);
        });

        container.innerHTML = order
          .map((fieldName) => {
            const color = FIELD_COLOR[fieldName] || "#1E40AF";
            const courses = grouped[fieldName];
            const cards = courses
              .map((c) => {
                const feeStr = fmt(c.fee);
                return `
        <div class="course-card">
          <div class="card-top">
            <span class="card-award">${c.award}</span>
          </div>
          <div class="course-name">${c.name}</div>
          <div class="card-info">
            <div class="info-item">
              <div class="info-label">Tuition Fee</div>
              <div class="info-value fee-val">${feeStr || '<span class="info-na">Contact MTU</span>'}</div>
            </div>
            <div class="info-item">
              <div class="info-label">Application Fee</div>
              <div class="info-value">€0</div>
            </div>
            <div class="info-item">
              <div class="info-label">Duration</div>
              <div class="info-value">${c.dur}</div>
            </div>
            <div class="info-item">
              <div class="info-label">Intake</div>
              <div class="info-value"><div class="intake-row"><span class="intake-badge intake-open">Sep</span></div></div>
            </div>
          </div>
          <div class="test-section">
            <div class="info-label" style="margin-bottom:7px;">English Test Requirements</div>
            <div class="score-grid">
              <div class="score-item"><span class="score-label">IELTS</span><span class="score-val">${SCORES.ielts}</span></div>
              <div class="score-item"><span class="score-label">TOEFL</span><span class="score-val">${SCORES.toefl}</span></div>
              <div class="score-item"><span class="score-label">PTE</span><span class="score-val">${SCORES.pte}</span></div>
              <div class="score-item"><span class="score-label">DET</span><span class="score-val">${SCORES.det}</span></div>
            </div>
          </div>
          <div class="card-divider"></div>
          <div class="card-footer">
            <a href="https://www.mtu.ie/" target="_blank" rel="noopener noreferrer" class="learn-btn">
              Learn More ${ARROW}
            </a>
          </div>
        </div>`;
              })
              .join("");
            return `
      <div class="field-section">
        <div class="field-header">
          <div class="field-dot"></div>
          <div class="field-name">${fieldName}</div>
          <span class="field-count">${courses.length} programme${courses.length !== 1 ? "s" : ""}</span>
        </div>
        <div class="course-grid">${cards}</div>
      </div>`;
          })
          .join("");
      }

      applyFilters();
    </script>
  </body>
</html>
