<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Munster Technological University – Programs</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800;900&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #00539b;
        --brand-dark: #003568;
        --brand-light: #e6f0f9;
        --accent: #e84c0e;
        --bg: #f2f7fc;
        --card-bg: #ffffff;
        --text: #0d1f33;
        --muted: #4a5f72;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Source Sans 3", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .hero {
        background: linear-gradient(
          140deg,
          #00539b 0%,
          #003568 55%,
          #001428 100%
        );
        color: white;
        padding: 60px 40px 50px;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        bottom: -80px;
        right: -80px;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: rgba(232, 76, 14, 0.15);
      }
      .hero-inner {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
      }
      .hero-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 18px;
      }
      .hero-tag::before {
        content: "";
        width: 30px;
        height: 3px;
        background: var(--accent);
        display: inline-block;
      }
      .hero h1 {
        font-family: "Raleway", sans-serif;
        font-size: clamp(28px, 5vw, 52px);
        font-weight: 900;
        line-height: 1.1;
        margin-bottom: 14px;
      }
      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 22px;
      }
      .hero-meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, 0.8);
      }
      .hero-meta-item i {
        color: var(--accent);
      }
      .hero-meta-item a {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: underline;
      }

      .wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px 60px;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 50px 0 20px;
      }
      .section-label h2 {
        font-family: "Raleway", sans-serif;
        font-size: 20px;
        font-weight: 800;
        color: var(--brand);
        white-space: nowrap;
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(to right, var(--brand-light), transparent);
      }

      .course-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 18px;
      }

      .course-card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 20px;
        border-left: 5px solid var(--brand);
        box-shadow: 0 2px 12px rgba(0, 83, 155, 0.08);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        display: flex;
        flex-direction: column;
      }
      .course-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(0, 83, 155, 0.15);
      }

      .course-title {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        margin-bottom: 12px;
      }
      .detail {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .detail i {
        color: var(--brand);
        width: 14px;
      }
      .badge {
        display: inline-block;
        background: var(--brand-light);
        color: var(--brand);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 10px;
      }

      .btn-group {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 14px;
      }
      .btn {
        flex: 1;
        padding: 9px 8px;
        border-radius: 7px;
        text-align: center;
        text-decoration: none;
        font-weight: 700;
        font-size: 12px;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-primary {
        background: var(--brand);
        color: white;
      }
      .btn-secondary {
        background: var(--brand-light);
        color: var(--brand);
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-tag">Cork & Kerry, Ireland</div>
        <h1>Munster Technological<br />University</h1>
        <div class="hero-meta">
          <div class="hero-meta-item">
            <i class="fa-solid fa-calendar-days"></i> Intake: September 2026
          </div>
          <div class="hero-meta-item">
            <i class="fa-solid fa-file-invoice"></i> Application Fee: Free
          </div>
          <div class="hero-meta-item">
            <i class="fa-solid fa-globe"></i>
            <a href="https://www.mtu.ie/" target="_blank">www.mtu.ie</a>
          </div>
        </div>
      </div>
    </div>

    <div class="wrapper" id="app"></div>

    <script>
      const sections = [
        {
          title: "Business & Management",
          courses: [
            ["MA in Global Business Practice", "€12,000", "1 Year"],
            ["MA in Human Resource Management", "€12,000", "1 Year"],
            [
              "MA in Journalism and Digital Content Creation",
              "€12,000",
              "1 Year",
            ],
            ["MA in Public Relations with New Media", "€12,000", "1 Year"],
            ["MSc in Marketing Practice", "€12,000", "1 Year"],
            ["MBS in Entrepreneurship and Marketing", "€12,000", "1 Year"],
            ["MSc in Management", "€9,950", "1 Year"],
            ["MA in Tourism and Heritage Management", "€9,950", "12 Months"],
          ],
        },
        {
          title: "Arts, Music & Creative",
          courses: [
            ["MA Contemporary Art Practice", "€12,000", "1 Year"],
            ["MA in Art and Process", "€12,000", "1 Year"],
            ["MA in Music (Taught)", "€12,000", "2 Years"],
            ["MA in Music and Technology", "€12,000", "1 Year"],
            ["MA/MSc in Music Technology", "€12,000", "12 Months"],
            ["MSc in Art Therapy", "€12,000", "2 Years"],
            [
              "Professional Master of Education (Art and Design)",
              "€12,000",
              "2 Years",
            ],
          ],
        },
        {
          title: "Engineering & Technology",
          courses: [
            [
              "MEng Civil Engineering (Environment and Energy)",
              "€12,000",
              "1 Year",
            ],
            ["MEng in Structural Engineering", "€12,000", "1 Year"],
            ["MSc in Computing", "€16,583", "12 Months"],
            ["MSc in Data Analytics", "€12,000", "12 Months"],
            [
              "MSc in Computing in Medical Device Software Engineering",
              "€10,000",
              "1–2 Years",
            ],
          ],
        },
        {
          title: "Science & Food Technology",
          courses: [
            [
              "MSc / PGDip in Agricultural Biotechnology",
              "€12,000",
              "12 Months",
            ],
            [
              "MSc in Sustainable Food Technology and Innovation",
              "€12,000",
              "1 or 2 Years",
            ],
            [
              "Postgraduate Diploma in Sustainable Food Technology",
              "€12,000",
              "1 or 2 Years",
            ],
            ["MBS in Strategic Data Analytics for Business", "TBC", "1 Year"],
          ],
        },
      ];

      const app = document.getElementById("app");
      sections.forEach((sec) => {
        const lbl = document.createElement("div");
        lbl.className = "section-label";
        lbl.innerHTML = `<h2>${sec.title}</h2>`;
        app.appendChild(lbl);

        const grid = document.createElement("div");
        grid.className = "course-grid";

        sec.courses.forEach((c) => {
          const card = document.createElement("div");
          card.className = "course-card";
          card.innerHTML = `
      <span class="badge">Postgraduate</span>
      <div class="course-title">${c[0]}</div>
      <div class="detail"><i class="fa-solid fa-euro-sign"></i> ${c[1]}</div>
      <div class="detail"><i class="fa-solid fa-clock"></i> ${c[2]}</div>
      <div class="detail"><i class="fa-solid fa-location-dot"></i> Cork / Kerry, Ireland</div>
      <div class="btn-group">
        <a href="https://www.mtu.ie/" target="_blank" class="btn btn-secondary">Learn More</a>
        <a href="https://cmst.xyz/form/7e8a525a-8729-4d95-8938-5ee4355d29ec/general-inquiry-forms" target="_blank" class="btn btn-primary">Apply Now</a>
      </div>
    `;
          grid.appendChild(card);
        });
        app.appendChild(grid);
      });
    </script>
  </body>
</html>
