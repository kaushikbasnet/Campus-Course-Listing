<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>National College of Ireland – Programs</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Nunito:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #1c3f7c;
        --brand-dark: #0f2550;
        --brand-light: #e8eef8;
        --accent: #e8a020;
        --bg: #f3f6fc;
        --card-bg: #ffffff;
        --text: #101828;
        --muted: #4f5f7a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Nunito", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .hero {
        background: linear-gradient(
          145deg,
          #1c3f7c 0%,
          #0f2550 60%,
          #060e22 100%
        );
        color: white;
        padding: 60px 40px 50px;
        position: relative;
        overflow: hidden;
      }
      .hero::before {
        content: "";
        position: absolute;
        top: -60px;
        right: -60px;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: rgba(232, 160, 32, 0.12);
      }
      .hero-inner {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
      }
      .hero-tag {
        display: inline-block;
        background: var(--accent);
        color: white;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 5px 14px;
        border-radius: 4px;
        margin-bottom: 18px;
      }
      .hero h1 {
        font-family: "Outfit", sans-serif;
        font-size: clamp(28px, 5vw, 52px);
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: 14px;
      }
      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 22px;
      }
      .hero-meta-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, 0.8);
      }
      .hero-meta-item i {
        color: var(--accent);
      }
      .hero-meta-item a {
        color: rgba(255, 255, 255, 0.85);
        text-decoration: underline;
      }

      .wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 24px 60px;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 50px 0 20px;
      }
      .section-label h2 {
        font-family: "Outfit", sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: var(--brand);
        white-space: nowrap;
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 2px;
        background: linear-gradient(to right, var(--brand-light), transparent);
      }

      .course-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 18px;
      }

      .course-card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 20px;
        border-top: 5px solid var(--brand);
        box-shadow: 0 2px 12px rgba(28, 63, 124, 0.08);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        display: flex;
        flex-direction: column;
      }
      .course-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(28, 63, 124, 0.15);
      }

      .course-title {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        margin-bottom: 12px;
      }
      .detail {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .detail i {
        color: var(--brand);
        width: 14px;
      }
      .badge {
        display: inline-block;
        background: var(--brand-light);
        color: var(--brand);
        font-size: 11px;
        font-weight: 600;
        padding: 3px 10px;
        border-radius: 20px;
        margin-bottom: 10px;
      }

      .btn-group {
        display: flex;
        gap: 8px;
        margin-top: auto;
        padding-top: 14px;
      }
      .btn {
        flex: 1;
        padding: 9px 8px;
        border-radius: 7px;
        text-align: center;
        text-decoration: none;
        font-weight: 700;
        font-size: 12px;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.85;
      }
      .btn-primary {
        background: var(--brand);
        color: white;
      }
      .btn-secondary {
        background: var(--brand-light);
        color: var(--brand);
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="hero-inner">
        <div class="hero-tag">Dublin, Ireland</div>
        <h1>National College of Ireland</h1>
        <div class="hero-meta">
          <div class="hero-meta-item">
            <i class="fa-solid fa-calendar-days"></i> Intake: September 2026
          </div>
          <div class="hero-meta-item">
            <i class="fa-solid fa-file-invoice"></i> Application Fee: Free
          </div>
          <div class="hero-meta-item">
            <i class="fa-solid fa-language"></i> Business: IELTS 6.5 |
            Computing: IELTS 6.0
          </div>
          <div class="hero-meta-item">
            <i class="fa-solid fa-globe"></i>
            <a href="https://www.ncirl.ie/Study/All-Courses" target="_blank"
              >ncirl.ie</a
            >
          </div>
        </div>
      </div>
    </div>

    <div class="wrapper" id="app"></div>

    <script>
      const sections = [
        {
          title: "School of Business",
          courses: [
            [
              "MA in Human Resource Management",
              "€17,000",
              "1 Year",
              "IELTS 6.5",
            ],
            [
              "Master of Business Administration (MBA)",
              "€13,650",
              "2 Years",
              "IELTS 5.5",
            ],
            ["MSc in Accounting", "€17,000", "1 Year", "IELTS 6.5"],
            [
              "MSc in Business Analytics for Decision Makers",
              "€17,000",
              "1 Year",
              "IELTS 6.5",
            ],
            ["MSc in Entrepreneurship", "€17,000", "1 Year", "IELTS 6.5"],
            ["MSc in Finance", "€17,000", "1 Year", "IELTS 6.5"],
            ["MSc in Fintech", "€17,000", "1 Year", "IELTS 6.5"],
            ["MSc in International Business", "€17,000", "1 Year", "IELTS 6.5"],
            ["MSc in Management", "€17,000", "1 Year", "IELTS 6.5"],
            ["MSc in Marketing", "€14,500", "1 Year", "IELTS 6.5"],
          ],
        },
        {
          title: "School of Computing",
          courses: [
            [
              "MSc in Artificial Intelligence",
              "€17,000",
              "1 Year",
              "IELTS 6.0",
            ],
            [
              "MSc in Artificial Intelligence for Business",
              "€17,000",
              "1 Year",
              "IELTS 6.5",
            ],
            ["MSc in Cloud Computing", "€17,000", "1 Year", "IELTS 6.0"],
            ["MSc in Cybersecurity", "€17,000", "1 Year", "IELTS 6.0"],
            ["MSc in Data Analytics", "€17,000", "1 Year", "IELTS 6.0"],
            ["MSc in Fintech", "€17,000", "1 Year", "IELTS 6.0"],
            ["MSc in Open Data Practice", "€17,000", "1 Year", "IELTS 6.0"],
          ],
        },
      ];

      const app = document.getElementById("app");
      sections.forEach((sec) => {
        const lbl = document.createElement("div");
        lbl.className = "section-label";
        lbl.innerHTML = `<h2>${sec.title}</h2>`;
        app.appendChild(lbl);

        const grid = document.createElement("div");
        grid.className = "course-grid";

        sec.courses.forEach((c) => {
          const card = document.createElement("div");
          card.className = "course-card";
          card.innerHTML = `
      <span class="badge">Postgraduate</span>
      <div class="course-title">${c[0]}</div>
      <div class="detail"><i class="fa-solid fa-euro-sign"></i> ${c[1]}</div>
      <div class="detail"><i class="fa-solid fa-clock"></i> ${c[2]}</div>
      <div class="detail"><i class="fa-solid fa-language"></i> ${c[3]}</div>
      <div class="detail"><i class="fa-solid fa-location-dot"></i> Dublin, Ireland</div>
      <div class="btn-group">
        <a href="https://www.ncirl.ie/Study/All-Courses" target="_blank" class="btn btn-secondary">Learn More</a>
        <a href="https://cmst.xyz/form/7e8a525a-8729-4d95-8938-5ee4355d29ec/general-inquiry-forms" target="_blank" class="btn btn-primary">Apply Now</a>
      </div>
    `;
          grid.appendChild(card);
        });
        app.appendChild(grid);
      });
    </script>
  </body>
</html>
